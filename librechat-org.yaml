  #       models:
  #           # Must match the deployment name of the model
  #           gpt-5:
  #             deploymentName: "gpt-5"
  custom:
    - name: "Azure-OpenAI"
      # A place holder - otherwise it becomes the default (OpenAI) key
      # Provide the key instead in each "model" block within "litellm/litellm-config.yaml"
      apiKey: ""
      # See the required changes above in "Start LiteLLM Proxy Server" step.
      baseURL: "https://qa-litellm.ccv.brown.edu"
      # A "default" model to start new users with. The "fetch" will pull the rest of the available models from LiteLLM
      # More or less this is "irrelevant", you can pick any model. Just pick one you have defined in LiteLLM.
      iconURL: azureOpenAI
      models:
        default:
          - 'gpt-5.4'
          - 'gpt-5.4-mini'
          - 'gpt-5.2-codex'
          - 'gpt-5.3-codex'
          - 'gpt-oss'
        fetch: false
      titleConvo: true
      titleModel: "gpt-5.4-mini"
      summarize: true
      summaryModel: "gpt-4o-mini"
      modelDisplayLabel: "OpenAI"  
      # titleConvo: true
      # titleModel: "gpt-5.2"
      # summarize: true
      # summaryModel: "gpt-4o-mini"
      # modelDisplayLabel: "OpenAI"
    - name: "OpenAI Reasoning Models"
      apiKey: ""
      baseURL: "${LITELLM_URL}"
      iconURL: openAI
      models:
        default:
          - 'o4-mini'
        fetch: false
      titleConvo: true
      titleModel: "o4-mini"
      summarize: true
      summaryModel: "o4-mini"
      modelDisplayLabel: "OpenAI-O models"
    - name: 'Kimi AI Models'
      apiKey: ""
      baseURL: "${LITELLM_URL}"
      models:
        default:
          - 'kimi-k2.5'
          - 'Kimi-K2.6'
        fetch: false
      titleConvo: true
      titleModel: "kimi-k2.5"
      summarize: true
      summaryModel: "kimi-k2.5"
      modelDisplayLabel: "kimi-k2.5"
    - name: "Google Models"
      apiKey: ""
      baseURL: "${LITELLM_URL}"
      iconURL: google
      models:
        default:
          - 'gemini-3.1-flash-lite-preview'
          - 'gemini-3.1-pro-preview'
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      modelDisplayLabel: "Gemini"
    - name: "GLM Models"
      apiKey: ""
      baseURL: "${LITELLM_URL}"
      iconURL: "https://upload.wikimedia.org/wikipedia/commons/f/f4/Z.ai_%28company_logo%29.svg"
      models:
        default:
          - 'glm-4.7-maas'
          - 'glm-5-maas'
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      modelDisplayLabel: "GLM-maas"
    - name: "Anthropic Models"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "${LITELLM_URL}"
      iconURL: anthropic 
      models:
        default:
          - 'claude-sonnet-4-6'
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      modelDisplayLabel: "Claude"

